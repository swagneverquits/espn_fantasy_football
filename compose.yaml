services:
  scraper:
    build: .
    container_name: fantasy-football-scraper
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      TZ: America/New_York
      GCS_BUCKET: "${GCS_BUCKET:-}"
    volumes:
      - ./config/leagues.toml:/app/config/leagues.toml:ro
      - ./results:/app/results



